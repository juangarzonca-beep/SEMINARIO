name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: PHPUnit en PHP 8.3
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          tools: composer:v2
          coverage: none
      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist
      - name: Ejecutar pruebas automatizadas
        run: composer test
